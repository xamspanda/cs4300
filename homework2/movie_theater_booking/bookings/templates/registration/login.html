{% extends 'bookings/base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Sign in</h1>
        {% if next and next != '/' %}<p class="text-body-secondary small">Sign in to continue.</p>{% endif %}
        <form method="post" action="{% url 'login' %}" novalidate>
          {% csrf_token %}
          {% include 'registration/_form_fields.html' %}
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-warning w-100">Sign in</button>
        </form>
        <p class="small text-center mt-3 mb-0">New here? <a href="{% url 'signup' %}">Create an account</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
